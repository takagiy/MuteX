<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tweetmuff</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="../icons/icon.svg" width="24" height="24" alt="">tweetmuff</h1>
    <label class="switch" title="Enable / disable filtering">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <section>
    <h2>Muted words</h2>
    <p id="syncStatus" class="muted">Not synced</p>
    <p id="localStatus" class="muted"></p>
    <div class="actions">
      <button id="editWords">Edit muted words</button>
      <button id="openSettings" class="secondary">Open X mute settings</button>
    </div>
    <p class="muted small hint">tweetmuff picks up your list whenever X loads it. To refresh, open X's muted words settings.</p>
  </section>

  <section>
    <label class="check">
      <input type="checkbox" id="applyToFollowing">
      Also apply to accounts you follow
    </label>
    <p class="muted small">When off, each word follows X's "exclude people you follow" setting.</p>
  </section>

  <script src="../src/core.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
