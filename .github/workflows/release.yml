name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: bun scripts/check-manifest.js "$GITHUB_REF_NAME"
      - name: Package
        run: zip -r "tweetmuff-$GITHUB_REF_NAME.zip" manifest.json src popup icons LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tweetmuff-$GITHUB_REF_NAME.zip" --title "tweetmuff $GITHUB_REF_NAME" --generate-notes --verify-tag
